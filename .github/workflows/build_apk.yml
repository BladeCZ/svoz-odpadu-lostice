name: Sestavení Android aplikace (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Možnost spustit ručně tlačítkem "Run workflow"

permissions:
  contents: write

jobs:
  build:
    name: Build SvozOdpaduLostice APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nastavení Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Nastavení Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sestavení APK (Release a Debug)
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SvozOdpaduLostice.apk 2>/dev/null || cp app/build/outputs/apk/debug/*.apk dist/SvozOdpaduLostice.apk

      - name: Uložení APK jako artefakt v GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SvozOdpaduLostice-APK
          path: |
            android/dist/SvozOdpaduLostice.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Nahrání APK do GitHub Releases pro přímé stažení v mobilu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Android aplikace Svoz odpadu Loštice" --notes "Automaticky sestavená Android aplikace (.apk) pro svoz odpadu a komunální služby města Loštice."
          fi
          if [ -f "android/dist/SvozOdpaduLostice.apk" ]; then
            gh release upload apk-latest android/dist/SvozOdpaduLostice.apk --clobber
          fi
